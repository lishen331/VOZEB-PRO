            - textbox "将描代文学家柳宗元创作的传记文学作品《童区寄传》进行改编。一个发生在唐朝年间的悬疑故事。主人公就是十一岁，名字就叫区寄。可以模仿白夜追凶、催眠大师的套路的心里悬疑片，严格按照 10 节拍表重新整理成一个详细的故事大纲。 暴雨后的山路上，十一岁的区寄独自赶着一头水牛回家。他突然发现林中有两个区寄独自赶往一夜回到。区寄害怕极了，那两人的买卖跟区寄追问：少女饼伤到二十七下后，他终于转变逃走。少女穷极挣扎，让这大师对爹，他们意识，都村民都沾血过往边的刀剑。..." [ref=e196]:
              - /placeholder: 将描代文学家柳宗元创作的传记文学作品《童区寄传》进行改编。一个发生在唐朝年间的悬疑故事。主人公就是十一岁，名字就叫区寄。可以模仿白夜追凶、催眠大师的套路的心里悬疑片，严格按照 10 节拍表重新整理成一个详细的故事大纲。  暴雨后的山路上，十一岁的区寄独自赶着一头水牛回家。他突然发现林中有两个区寄独自赶往一夜回到。区寄害怕极了，那两人的买卖跟区寄追问：少女饼伤到二十七下后，他终于转变逃走。少女穷极挣扎，让这大师对爹，他们意识，都村民都沾血过往边的刀剑。...
              - text: "# 《从前有座山》第一集 · 传灯 **画面比例：9:16** **风格：电影感国漫 / 水墨写真结合三维** **建议时长：约90秒** **适配场景：横竖屏短视频平台** --- ## 人物表 - **老和尚**：白眉垂肩，僧袍素净，眼神温和如深山古井。 - **小和尚**：约十岁，圆头圆脑，眼睛亮得像新磨的墨。 - **娃娃僧**：约七八岁，是多年后的小小和尚。 --- ## 镜头1 · 外景 · 山 / 黄昏 **【画面】** 竖屏构图，一座孤峰从画面下方拔起，云海截断山腰。山顶古寺只露出一角飞檐，像墨迹落在宣纸上。风过，檐角铜铃轻晃。 **【动作指导】** 镜头从铜铃缓缓下移，穿过飞檐，向下落入寺中，模拟“入画”感。 **【声音】** 山风、鸟鸣、铜铃一声。 **【字幕】** 从前有座山 --- ## 镜头2 · 内景 · 寺中庭院 / 夜 **【画面】** 老松斜伸，石桌上一盏油灯。老和尚闭目端坐，小和尚趴在石桌边看一只蚂蚁爬过桌面。 **【动作指导】** 小和尚用指尖轻轻截住蚂蚁的去路，蚂蚁绕指而过。老和尚睁开眼，拿起茶壶斟茶，茶水声缓缓响起。 **【人物对话】** 小和尚：师父，山的那边是什么？ 老和尚：你听到了什么？ 小和尚：……风声，还有您倒茶的声音。 老和尚：那山那边，也是风声，和有人倒茶的声音。 小和尚：有人？谁呀？ 老和尚放下茶壶：我给你讲个故事，你就知道了。 --- ## 镜头3 · 内景 · 庭院 / 夜 **【画面】** 烛火被风吹低，墙上老和尚的影子和小和尚的影子靠得很近，像两片相依的墨。 **【动作指导】** 老和尚说一句，小和尚就抢一句。两个人像在打一场温柔的乒乓球。 **【人物对话】** 老和尚：从前有座山—— 小和尚：山里有座庙！ 老和尚：庙里有个老和尚—— 小和尚：在给小和尚讲故事！ 老和尚笑了：讲的是什么呢？ 小和尚忽然卡住了。 小和尚：讲的还是……从前有座山？ **【动作指导】** 老和尚用杯盖轻轻掠过杯沿，发出一声清脆长鸣。 老和尚：你听，这个故事像不像这杯茶？ 小和尚：滚来滚去，没个完。 老和尚：可每一片茶叶，都翻过了自己的山。 --- ## 镜头4 · 想象画面 / 茶中山 **【画面】** 小和尚低头看向茶杯，杯中月色落在水面，水底竟然倒映着一座山，山里有座庙，庙门口有两个影子。 **【动作指导】** 镜头微距穿过水面，涟漪荡漾。现实场景瞬间被水墨吞没，进入“粒子水墨”空间。茶水中世界层层叠叠：山中有庙，庙中有人，人中又映出山，形成一个循环的“回”字。 **【旁白】** 山在茶里，茶在手里，手在故事里。 --- ## 镜头5 · 现实 · 庭院 **【动作指导】** 小和尚猛然抬头，瞳孔里还残留着山水光影。 **【人物对话】** 小和尚：师父，我好像去山那边了。 老和尚：山那边怎么样？ 小和尚：有风，还有一杯茶，茶里又有一座山。 老和尚点点头。 老和尚：那就对了。讲故事不是为了让你走到山那边，是为了让你知道——你心里也有一座山。 **【动作指导】** 老和尚把茶杯轻轻推向小和尚。 老和尚：以后，你讲给别人听的时候，山顶就在你手心里了。 --- ## 镜头6 · 外景 · 山巅 / 清晨 / 多年后 **【画面】** 同一个小和尚长大了，身穿同一件样式但洗得发白的僧袍，坐在崖边。他面前是一个更小的娃娃僧。 **【动作指导】** 匹配剪辑：小和尚当年闭眼听风的侧脸，缓缓叠化到老僧闭眼讲故事的侧脸。 **【人物对话】** 娃娃僧：师父，山那边是什么？ 老僧（当年的小和尚）睁开眼，微微一笑。 老僧：我讲个故事吧。从前有座山—— 娃娃僧立刻接：山里有座庙！ 老僧：庙里有个—— （两人异口同声）：老和尚，在给小和尚讲故事。 --- ## 镜头7 · 外景 · 云海 / 日出 **【画面】** 镜头缓缓上升，拉远。群山如沉默的墨迹，古寺立在画面中央，一大一小两个身影坐在崖边。远山之外，还有更远的山。 **【动作指导】** 人物在画面中越来越小，最终与山融为一体。纯音乐起，铜铃余韵悠长。 **【字幕】** 从前有座山，山里有座庙。 **【声音】** 风铃一声，渐淡。 **【画面】** 全黑。 --- **第一集 · 完**"
