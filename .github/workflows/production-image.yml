name: Production image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing vX.Y.Z tag to deploy"
        required: true
        type: string

concurrency:
  group: production-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/lishen331/vozeb-pro
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Validate release tag and main ancestry
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Release tag must match vX.Y.Z: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          release_sha="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$release_sha" FETCH_HEAD; then
            printf 'Release commit is not contained in origin/main.\n' >&2
            exit 1
          fi
          printf 'sha=%s\n' "$release_sha" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm test
          pnpm run format:check

      - name: Production build
        run: pnpm run build
        env:
          NEXT_SKIP_BUILD_TYPECHECK: "1"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable production images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_NAME }}:sha-${{ steps.release.outputs.sha }}
          cache-from: type=gha,scope=production-amd64
          cache-to: type=gha,mode=max,scope=production-amd64

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
      PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
    steps:
      - name: Checkout release compose
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull immutable production image
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Release tag must match vX.Y.Z: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          docker pull "${IMAGE_NAME}:${RELEASE_TAG}"

      - name: Deploy with health check and rollback
        shell: bash
        run: |
          set -euo pipefail

          key_file="$RUNNER_TEMP/production_deploy_key"
          known_hosts_file="$RUNNER_TEMP/production_known_hosts"
          cleanup() {
            rm -f "$key_file" "$known_hosts_file"
          }
          trap cleanup EXIT

          for required in PRODUCTION_SSH_HOST PRODUCTION_SSH_PORT PRODUCTION_SSH_USER PRODUCTION_SSH_PRIVATE_KEY; do
            if [ -z "${!required:-}" ]; then
              printf 'Missing required production SSH configuration: %s\n' "$required" >&2
              exit 1
            fi
          done

          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" > /dev/null
          ssh-keyscan -p "$PRODUCTION_SSH_PORT" -H "$PRODUCTION_SSH_HOST" >> "$known_hosts_file"

          ssh_args=(
            -i "$key_file"
            -p "$PRODUCTION_SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts_file"
          )
          target="$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST"
          image="${IMAGE_NAME}:${RELEASE_TAG}"

          scp "${ssh_args[@]}" compose.production.yml "${target}:/opt/vozeb-pro/production/compose.production.yml"
          docker save "$image" | gzip -1 | ssh "${ssh_args[@]}" "$target" 'gunzip | docker load'

          old_image="$(ssh "${ssh_args[@]}" "$target" \
            "docker inspect --format '{{.Config.Image}}' vozeb-pro 2>/dev/null || true")"

          ssh "${ssh_args[@]}" "$target" \
            "cd /opt/vozeb-pro/production && VOZEB_PRO_IMAGE='$image' docker compose -f compose.production.yml up -d --pull never"

          healthy=false
          for attempt in $(seq 1 30); do
            if ssh "${ssh_args[@]}" "$target" \
              'curl --fail --silent --show-error --output /dev/null --max-time 10 http://127.0.0.1:3000/api/health/ready'; then
              printf 'Production readiness check passed on attempt %s/30\n' "$attempt"
              healthy=true
              break
            fi
            if [ "$attempt" -lt 30 ]; then
              sleep 5
            fi
          done

          if [ "$healthy" != true ]; then
            printf 'Production readiness check failed after 30 attempts; compose status:\n' >&2
            ssh "${ssh_args[@]}" "$target" \
              'cd /opt/vozeb-pro/production && docker compose -f compose.production.yml ps' >&2 || true
            if [ -n "$old_image" ]; then
              printf 'Rolling back to the previous image.\n' >&2
              ssh "${ssh_args[@]}" "$target" \
                "cd /opt/vozeb-pro/production && VOZEB_PRO_IMAGE='$old_image' docker compose -f compose.production.yml up -d --pull never" || true
            fi
            exit 1
          fi

          ssh "${ssh_args[@]}" "$target" \
            'cd /opt/vozeb-pro/production && docker compose -f compose.production.yml ps'
