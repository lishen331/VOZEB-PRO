name: Staging image

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

concurrency:
  group: staging-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/lishen331/vozeb-pro
  STAGING_IMAGE_PROXY: ghcr.nju.edu.cn

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_SSH_PRIVATE_KEY_B64: ${{ secrets.STAGING_SSH_PRIVATE_KEY_B64 }}
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm test
          pnpm run format:check

      - name: Production build
        run: pnpm run build
        env:
          NEXT_SKIP_BUILD_TYPECHECK: "1"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:develop
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy image over SSH
        shell: bash
        run: |
          set -euo pipefail

          key_file="$RUNNER_TEMP/staging_deploy_key"
          known_hosts_file="$RUNNER_TEMP/staging_known_hosts"
          cleanup() {
            rm -f "$key_file" "$known_hosts_file"
          }
          trap cleanup EXIT

          if [ -z "$STAGING_SSH_PRIVATE_KEY_B64" ]; then
            printf 'Missing STAGING_SSH_PRIVATE_KEY_B64 secret.\n' >&2
            exit 1
          fi

          printf '%s' "$STAGING_SSH_PRIVATE_KEY_B64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" > /dev/null
          touch "$known_hosts_file"
          ssh-keyscan -p "$STAGING_SSH_PORT" -H "$STAGING_SSH_HOST" >> "$known_hosts_file"

          image="${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          ssh_opts=(-i "$key_file" -p "$STAGING_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file" -o ServerAliveInterval=30 -o ServerAliveCountMax=20)

          # Pull the image on the staging server straight from GHCR (the package is
          # public, so no registry login is needed there). This replaces pushing the
          # 1.24GB image over the runner's heavily throttled (~50KB/s) SSH upload.
          #
          # Each attempt gets a long timeout on purpose. Killing `docker pull` throws
          # away layers that were downloaded but not yet extracted, so short
          # kill-and-retry loops (120s and 300s were both tried) redownload the same
          # layers every attempt and never finish. Disk usage is printed on failure
          # because slow extraction on a nearly full disk looks identical to a stall.
          ssh "${ssh_opts[@]}" "$STAGING_SSH_USER@$STAGING_SSH_HOST" "IMAGE='$image' bash -s" <<'REMOTE'
          set -euo pipefail
          pulled=""
          for attempt in $(seq 1 3); do
            if timeout -k 30 1200 docker pull "$IMAGE"; then
              pulled="yes"
              printf 'Image pull succeeded on attempt %s/3\n' "$attempt"
              break
            fi
            printf 'Image pull attempt %s/3 did not finish within 20 minutes; retrying\n' "$attempt" >&2
            df -h / /var/lib/docker 2>/dev/null >&2 || true
            sleep 10
          done
          if [ -z "$pulled" ]; then
            printf 'Image pull failed after 3 attempts.\n' >&2
            docker system df >&2 || true
            exit 1
          fi
          cd /opt/vozeb-pro/staging
          # Persist the deployed image into .env so a later manual
          # `docker compose restart`/`up` on the server reuses this exact
          # image instead of rolling back to a stale VOZEB_PRO_IMAGE value.
          if grep -q '^VOZEB_PRO_IMAGE=' .env; then
            tmp="$(mktemp)"
            sed "s|^VOZEB_PRO_IMAGE=.*|VOZEB_PRO_IMAGE=${IMAGE}|" .env > "$tmp"
            cat "$tmp" > .env
            rm -f "$tmp"
          else
            printf 'VOZEB_PRO_IMAGE=%s\n' "$IMAGE" >> .env
          fi
          VOZEB_PRO_IMAGE="$IMAGE" docker compose up -d --pull never --no-deps app generation-worker
          REMOTE

          for attempt in $(seq 1 30); do
            if ssh \
              -i "$key_file" \
              -p "$STAGING_SSH_PORT" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$known_hosts_file" \
              "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
              'curl --fail --silent --show-error --output /dev/null --max-time 10 http://127.0.0.1:3001/api/health/ready'; then
              printf 'Readiness check passed on attempt %s/30\n' "$attempt"
              exit 0
            fi

            if [ "$attempt" -lt 30 ]; then
              sleep 5
            fi
          done

          printf 'Readiness check failed after 30 attempts.\n' >&2
          exit 1
