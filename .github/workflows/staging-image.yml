name: Staging image

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

concurrency:
  group: staging-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/lishen331/vozeb-pro
  STAGING_IMAGE_PROXY: ghcr.nju.edu.cn

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_SSH_PRIVATE_KEY_B64: ${{ secrets.STAGING_SSH_PRIVATE_KEY_B64 }}
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm test
          pnpm run format:check

      - name: Production build
        run: pnpm run build
        env:
          NEXT_SKIP_BUILD_TYPECHECK: "1"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:develop
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy image over SSH
        shell: bash
        run: |
          set -euo pipefail

          key_file="$RUNNER_TEMP/staging_deploy_key"
          known_hosts_file="$RUNNER_TEMP/staging_known_hosts"
          cleanup() {
            rm -f "$key_file" "$known_hosts_file"
          }
          trap cleanup EXIT

          if [ -z "$STAGING_SSH_PRIVATE_KEY_B64" ]; then
            printf 'Missing STAGING_SSH_PRIVATE_KEY_B64 secret.\n' >&2
            exit 1
          fi

          printf '%s' "$STAGING_SSH_PRIVATE_KEY_B64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" > /dev/null
          touch "$known_hosts_file"
          ssh-keyscan -p "$STAGING_SSH_PORT" -H "$STAGING_SSH_HOST" >> "$known_hosts_file"

          image="${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          # Transfer the already-built image directly. This avoids the
          # staging server's severely throttled GHCR blob egress.
          docker save "$image" | gzip -1 | ssh \
            -i "$key_file" \
            -p "$STAGING_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            'gunzip | docker load'

          ssh \
            -i "$key_file" \
            -p "$STAGING_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "cd /opt/vozeb-pro/staging && VOZEB_PRO_IMAGE='$image' docker compose up -d --pull never --no-deps app generation-worker"

          for attempt in $(seq 1 30); do
            if ssh \
              -i "$key_file" \
              -p "$STAGING_SSH_PORT" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$known_hosts_file" \
              "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
              'curl --fail --silent --show-error --output /dev/null --max-time 10 http://127.0.0.1:3001/api/health/ready'; then
              printf 'Readiness check passed on attempt %s/30\n' "$attempt"
              exit 0
            fi

            if [ "$attempt" -lt 30 ]; then
              sleep 5
            fi
          done

          printf 'Readiness check failed after 30 attempts.\n' >&2
          exit 1
